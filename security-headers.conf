# Security headers — included in EVERY location/server block that emits a
# response. In nginx, a single add_header in a nested block DELETES the
# entire inherited add_header set, so a server-level-only declaration would
# reach none of the SPA documents served from location blocks. This file is
# COPY'd into the image (see Dockerfile) and `include`d in each block; if it
# is ever missing, `nginx -t` fails at boot (fail-closed).
#
# img-src blob: is required — Recovery.tsx builds blob: URLs for inline
# images. data: covers small inline data-URI images. style 'unsafe-inline'
# is required for React inline style props used throughout the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
