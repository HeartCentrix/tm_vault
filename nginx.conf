worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-level security headers. nginx does NOT merge add_header across
    # levels: any block below that declares its own add_header must re-include
    # this snippet, or it would drop the entire inherited set for that block.
    include /etc/nginx/security-headers.conf;

    location /api/ {
      include /etc/nginx/security-headers.conf;
      proxy_pass http://api-gateway:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 3600s;       # SSE job-progress streams
      proxy_buffering off;
    }

    # Hashed build assets: cache forever, but a MISSING asset must 404 —
    # never fall back to index.html. Serving HTML as a .js (the old
    # try_files /index.html fallback) is what white-screens a client that
    # still holds a stale index.html referencing a now-deleted asset hash.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so every load picks up the current
    # asset hashes after a redeploy. The SPA fallback below serves it too.
    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      try_files $uri $uri/ /index.html;
    }
  }
}
